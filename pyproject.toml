[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=69", "wheel"]

[project]
authors = [
  {name = "Chain Frost", email = "chainfrost@outlook.com"},
]
classifiers = [
  "Programming Language :: Python :: 3.14",
  "Operating System :: Microsoft :: Windows",
]
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "bottleneck",
  "pyshp",
  "geopandas",
  "fiona",
  "pyarrow",
  "fastparquet",
  "matplotlib",
  "colorama",
  "XlsxWriter",
  "psutil",
  "laspy[lazrs]",
  "tqdm",
  "rasterio",
  "shapely>=2",
  "seaborn",
  "requests",
  "openpyxl",
  "loguru",
  "tabulate",
  "pypdf",
  "cryptography>=3.1",
  "ezdxf",
  "rich",
  "pytuflow>=1.2",
  "run-hy8>=2026.10.16.1",
  'ryan-culverts>=26.10.19.1',
]
description = "Collection of TUFLOW and data processing functions."
license = "SUL-1.0"
name = "ryan-tools"
readme = "README.md"
requires-python = ">=3.14"
version = "26.11.9.1"

[project.optional-dependencies]
dev = [
  "build",
  "pandas-stubs>=3.1.0.261029",
  "pyarrow-stubs",
  "types-psutil",
  "types-rasterio>=1.5.2.20261029",
  "scipy-stubs",
  "distributed",
  "pillow-heif>=1.8.0",
  "python-docx",
  "pyright>=1.1.414",
  "pytest",
  "pytest-cov",
  "ruff==0.16.6",
]
mcp = [
  "mcp[cli]>=2.1,<3",
]

[project.scripts]
ryan-mcp = "ryan_library.mcp.server:main"
ryan-scripts = "ryan_library.mcp.installed_scripts:main"
tuflow-initialiser = "ryan_library.orchestrators.tuflow.initialiser.cli:main"

[project.urls]
Repository = "https://github.com/Chain-Frost/ryan-tools"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"ryan_library.classes" = ["*.json"]
"ryan_library.resources.mcp" = ["*.json"]
"ryan_library.resources.qgis.tuflow" = ["*.qml"]
"ryan_library.resources.tuflow_templates" = [
  ".gitignore",
  "model/*.csv",
  "model/*.tbc",
  "model/*.tef",
  "model/*.tgc",
  "model/*.tsoilf",
  "runs/*.bat",
  "runs/*.tcf",
  "runs/*.trd",
]
"vendor" = ["README.md"]
"vendor.PyHMA" = ["README.md", "LICENSE"]
"vendor.simil" = ["README.md", "LICENSE"]

[tool.setuptools.packages.find]
exclude = [
  "tests",
  "tests.*",
]
include = [
  "culvert_results",
  "culvert_results.*",
  "gis_processing",
  "gis_processing.*",
  "log_processing",
  "log_processing.*",
  "model_management",
  "model_management.*",
  "po_and_timeseries",
  "po_and_timeseries.*",
  "raster_processing",
  "raster_processing.*",
  "ryan_library",
  "ryan_library.*",
  "vendor",
  "vendor.PyHMA",
  "vendor.PyHMA.*",
  "vendor.simil",
  "vendor.simil.*",
]
namespaces = true
where = [".", "ryan-scripts/TUFLOW-python"]

[tool.pyright]
extraPaths = ["vendor"]
include = ["ryan_library", "ryan-scripts"]
pythonVersion = "3.14"
reportUnnecessaryTypeIgnoreComment = "error"
typeCheckingMode = "strict"

[[tool.pyright.executionEnvironments]]
extraPaths = ["repo-scripts", ".", "vendor"]
root = "repo-scripts"

[[tool.pyright.executionEnvironments]]
extraPaths = [
  ".",
  "vendor",
  "ryan-scripts/TUFLOW-python",
  "ryan-scripts/TUFLOW-python/raster_processing",
  "ryan-scripts/unsorted-python",
  "ryan-scripts/gdal-python",
  "ryan-scripts/RORB-python",
  "ryan-scripts/hydrology-python",
  "ryan-scripts/other",
]
root = "tests/scripts/promoted_scripts"

[[tool.pyright.executionEnvironments]]
extraPaths = ["vendor"]
root = "."
