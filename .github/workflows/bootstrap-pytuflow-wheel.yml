# One-time branch-only bootstrap; remove after the exact artifact is committed.
name: Bootstrap accepted PyTuflow wheel
on:
  push:
    branches: [ci/dependency-groups-follow-up-20261108]
    paths: [repo-scripts/vendor_pytuflow_wheel.py]
permissions:
  contents: write
jobs:
  rebuild-exact-wheel:
    if: github.repository == 'Chain-Frost/ryan-tools' && github.ref == 'refs/heads/ci/dependency-groups-follow-up-20261108'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Rebuild accepted bytes from exact source without runtime dependencies
        shell: pwsh
        run: |
          python -m pip install "hatchling>=1.26"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $out = Join-Path $env:RUNNER_TEMP "accepted-pytuflow"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          python -m pip wheel --no-deps --no-cache-dir --no-build-isolation --wheel-dir $out "https://github.com/Chain-Frost/PyTuflow/archive/887534ea8c15b80d185a38a7ead1d42ab42a7167.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python repo-scripts/vendor_pytuflow_wheel.py --stage (Join-Path $out "pytuflow-1.3.0-py3-none-any.whl")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python repo-scripts/vendor_pytuflow_wheel.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit verified artifact to this branch only
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "repo-scripts/wheels/pytuflow/887534ea8c15b80d185a38a7ead1d42ab42a7167/"
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Output "Accepted wheel already committed"; exit 0 }
          git commit -m "Vendor accepted PyTuflow wheel from pinned revision"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:ci/dependency-groups-follow-up-20261108
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
