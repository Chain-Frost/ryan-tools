name: PR 100 Wheel Build

on:
  push:
    branches:
      - feature/issue-99-tuflow-culvert-engines

permissions:
  contents: write

jobs:
  build-wheel:
    if: ${{ !contains(github.event.head_commit.message, '[wheel-sync]') }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialise package resources
        shell: pwsh
        run: |
          git submodule sync -- qgis-resources vendor/run_hy8 vendor/ryan_culverts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule update --init qgis-resources vendor/run_hy8 vendor/ryan_culverts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install build frontend
        shell: pwsh
        run: |
          python -m pip install --upgrade build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and verify current package version
        shell: pwsh
        run: |
          python repo-scripts/build_library.py --no-bump --skip-pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: pr100-wheel
          path: dist/ryan_functions-*.whl
          if-no-files-found: error

      - name: Commit verified wheel to branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist/ryan_functions-*.whl
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Retained wheel is already current."
            exit 0
          }
          git commit -m "[wheel-sync] refresh retained package wheel"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
