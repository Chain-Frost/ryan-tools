name: Scope 03 runner acceptance

on:
  push:
    branches:
      - feat/tuflow-runner-scope03-20261031
    paths:
      - ".github/workflows/tuflow-runner-scope03-check.yml"
      - "ryan_library/orchestrators/tuflow/simulation_runner.py"
      - "ryan-scripts/TUFLOW-python/model_management/run_tuflow_simulations.py"
      - "tests/orchestrators/tuflow/test_simulation_runner.py"
      - "tests/scripts/test_run_tuflow_simulations.py"
      - "tests/scripts/test_tuflow_advisory_runner.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-fake-process-and-wheel:
    name: Windows Python 3.14 fake-process and installed-wheel checks
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install checks without GIS/PyTUFLOW runtime
        run: python -m pip install pytest ruff==0.16.6 pyright build psutil rich
      - name: Scoped Ruff lint and format
        shell: pwsh
        run: |
          $files = @(
            "ryan_library/orchestrators/tuflow/simulation_runner.py",
            "ryan-scripts/TUFLOW-python/model_management/run_tuflow_simulations.py",
            "tests/orchestrators/tuflow/test_simulation_runner.py",
            "tests/scripts/test_run_tuflow_simulations.py",
            "tests/scripts/test_tuflow_advisory_runner.py"
          )
          python -m ruff check @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff format --check @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Strict typing of owned production files
        run: python -m pyright ryan_library/orchestrators/tuflow/simulation_runner.py ryan-scripts/TUFLOW-python/model_management/run_tuflow_simulations.py
      - name: Fake process and wrapper tests (no solver)
        run: python -m pytest -q tests/orchestrators/tuflow/test_simulation_runner.py tests/scripts/test_run_tuflow_simulations.py tests/scripts/test_tuflow_advisory_runner.py
      - name: Package wheel (no release)
        run: python -m build --wheel --no-isolation
      - name: Install wheel into ordinary Python
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          python -m pip install --no-deps --force-reinstall $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Copied wrapper outside checkout: help and export-only (no solver)
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "scope03-copied"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item "ryan-scripts/TUFLOW-python/model_management/run_tuflow_simulations.py" $target
          Set-Content -Path (Join-Path $target "input.txt") -Value '-e1 A "C:\models\Missing.tcf"'
          Push-Location $target
          try {
            Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
            python .\run_tuflow_simulations.py --help
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python .\run_tuflow_simulations.py --mode textfiles --input-file input.txt --no-tcf --solver-exe 'C:\not-installed\TUFLOW.exe' --export-only --no-pause
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not (Get-ChildItem -Path . -Filter '*_commands_*.bat')) { throw 'Expected copied-wrapper editable BAT export.' }
          } finally {
            Pop-Location
          }
