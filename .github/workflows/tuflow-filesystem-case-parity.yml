name: TUFLOW filesystem case parity

on:
  pull_request:
    paths:
      - "ryan_library/functions/tuflow/dependency_index.py"
      - "tests/functions/tuflow/test_dependency_index_posix.py"
      - ".github/workflows/tuflow-filesystem-case-parity.yml"
  workflow_dispatch:

jobs:
  filesystem-case-parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated regression runner
        run: python -m pip install pytest
      - name: Test host-correct filesystem checks
        run: python -m pytest -q tests/functions/tuflow/test_dependency_index_posix.py
