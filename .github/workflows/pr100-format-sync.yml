name: PR 100 Format Sync

on:
  push:
    branches:
      - feature/issue-99-tuflow-culvert-engines

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[format-sync]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Ruff
        shell: pwsh
        run: python -m pip install ruff==0.16.6
      - name: Format changed culvert files
        shell: pwsh
        run: >-
          python -m ruff format
          ryan_library/functions/culvert/tuflow_attributes.py
          ryan_library/functions/culvert/tuflow_configuration.py
          ryan_library/functions/culvert/tuflow_engines.py
          tests/scripts/test_tuflow_culvert_wrappers.py
      - name: Commit formatting
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ryan_library/functions/culvert/tuflow_attributes.py ryan_library/functions/culvert/tuflow_configuration.py ryan_library/functions/culvert/tuflow_engines.py tests/scripts/test_tuflow_culvert_wrappers.py
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "[format-sync] apply Ruff formatting"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
