name: TUFLOW POSIX physical identity parity

on:
  pull_request:
    paths:
      - ".github/workflows/tuflow-posix-physical-parity.yml"
      - "tests/fixtures/tuflow_example_repro/run_checks.py"
      - "tests/fixtures/tuflow_example_repro/test_run_checks.py"
      - "tests/fixtures/tuflow_example_repro/test_linux_case_overlay.py"
  workflow_dispatch:

jobs:
  physical-identity-parity:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Initialise immutable public test data
        run: git submodule update --init tests/test_data
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install parser and isolated consumer dependencies
        run: |
          python -m pip install "git+https://github.com/Chain-Frost/PyTuflow.git@e51389ce098b8f9d32a58bab9a7f518fd430a6ef"
          python -m pip install -e . --no-deps
          python -m pip install pytest pyshp loguru colorama psutil
      - name: Verify alias, layer and POSIX case-distinct identities
        run: python -m pytest -q tests/fixtures/tuflow_example_repro/test_run_checks.py tests/fixtures/tuflow_example_repro/test_linux_case_overlay.py
