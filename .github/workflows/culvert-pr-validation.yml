name: Culvert PR validation

on:
  push:
    branches:
      - feature/culvert-workflow-80
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install focused validation tools
        shell: pwsh
        run: python -m pip install pytest ruff==0.16.6 pyright build

      - name: Ruff format check
        shell: pwsh
        run: >-
          python -m ruff format --check
          ryan_library/classes/culvert
          ryan_library/functions/culvert
          ryan_library/orchestrators/culvert
          ryan-scripts/culvert.py
          tests/culvert

      - name: Ruff lint
        shell: pwsh
        run: >-
          python -m ruff check
          ryan_library/classes/culvert
          ryan_library/functions/culvert
          ryan_library/orchestrators/culvert
          ryan-scripts/culvert.py
          tests/culvert

      - name: Strict Pyright on modified Python files
        shell: pwsh
        run: >-
          pyright
          ryan_library/classes/culvert
          ryan_library/functions/culvert
          ryan_library/orchestrators/culvert
          ryan-scripts/culvert.py

      - name: Focused tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD;$PWD/vendor/ryan_culverts/src"
          python -m pytest tests/culvert -q

      - name: Wrapper help smoke check
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD;$PWD/vendor/ryan_culverts/src"
          python ryan-scripts/culvert.py --help

      - name: Documentation links
        shell: pwsh
        run: python repo-scripts/check_documentation.py

      - name: No-bump package build verification
        shell: pwsh
        run: python repo-scripts/build_library.py --no-bump --skip-pip --skip-artifacts
