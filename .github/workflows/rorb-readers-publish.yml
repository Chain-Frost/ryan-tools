name: Standalone RORB readers release

on:
  pull_request:
    paths:
      - 'packaging/rorb-readers/**'
      - 'ryan_library/functions/RORB/**'
      - 'ryan_library/__init__.py'
      - 'ryan_library/functions/__init__.py'
      - 'ryan_library/py.typed'
      - '.github/workflows/rorb-readers-publish.yml'
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact current main commit SHA selected for publication'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rorb-readers-${{ github.event.pull_request.number || 'publication' }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       github.repository == 'Chain-Frost/ryan-tools' &&
       github.ref == 'refs/heads/main' &&
       github.sha == inputs.source_sha &&
       vars.RORB_READERS_PUBLISH_ENABLED == 'true')
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      wheel_sha: ${{ steps.inspect.outputs.wheel_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Build only the standalone reader wheel
        run: |
          python -m pip install twine
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/reader-dist" ./packaging/rorb-readers
          python -m twine check --strict "$RUNNER_TEMP"/reader-dist/*.whl
      - name: Inspect package identity, licence and canonical source bytes
        id: inspect
        run: |
          python - <<'PY'
          import email
          import hashlib
          import os
          import tomllib
          import zipfile
          from pathlib import Path

          dist = Path(os.environ["RUNNER_TEMP"]) / "reader-dist"
          files = list(dist.iterdir())
          assert len(files) == 1 and files[0].name.endswith("-py3-none-any.whl"), files
          wheel = files[0]
          with Path("packaging/rorb-readers/pyproject.toml").open("rb") as f:
              project = tomllib.load(f)["project"]
          assert project["name"] == "ryan-rorb-readers"
          assert project["version"] == "26.11.24.1"
          assert project["requires-python"] == ">=3.11"
          assert project["dependencies"] == []
          with zipfile.ZipFile(wheel) as z:
              names = z.namelist()
              assert len(names) == len(set(names))
              metadata = [n for n in names if n.endswith(".dist-info/METADATA")]
              assert len(metadata) == 1
              m = email.message_from_bytes(z.read(metadata[0]))
              assert m["Name"] == project["name"]
              assert m["Version"] == project["version"]
              assert m["Requires-Python"] == project["requires-python"]
              assert not m.get_all("Requires-Dist")
              assert m["License-Expression"] == "LicenseRef-SUL-1.0"
              licenses = [n for n in names if n.endswith(".dist-info/licenses/LICENSE")]
              assert len(licenses) == 1
              assert z.read(licenses[0]) == Path("packaging/rorb-readers/LICENSE").read_bytes()
              canonical = {
                  "ryan_library/functions/RORB/" + n + ".py"
                  for n in ("reader_types", "readers", "output_reader", "result_readers",
                            "parameter_reader", "associations")
              }
              canonical |= {"ryan_library/__init__.py", "ryan_library/functions/__init__.py",
                            "ryan_library/py.typed"}
              allowed = canonical | {"ryan_library/functions/RORB/__init__.py"}
              payload = {n for n in names if not n.startswith(metadata[0].split("/")[0] + "/")}
              assert canonical <= payload <= allowed, payload
              for name in payload:
                  assert z.read(name) == Path(name).read_bytes(), name
          digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              print(f"wheel_sha={digest}", file=out)
          print(f"{wheel.name} sha256={digest}; source={os.environ['GITHUB_SHA']}")
          PY
      - name: Retain exact wheel for verification and publication
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: standalone-rorb-readers-wheel
          path: ${{ runner.temp }}/reader-dist/*.whl
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/reader-dist
          digest-mismatch: error
      - name: Verify exact isolated wheel and canonical site-binding API
        shell: pwsh
        env:
          WHEEL_SHA: ${{ needs.build.outputs.wheel_sha }}
        run: |
          $files = @(Get-ChildItem "$env:RUNNER_TEMP/reader-dist" -Recurse -File)
          if ($files.Count -ne 1 -or $files[0].Extension -ne ".whl") { throw "Expected one wheel" }
          $wheel = $files[0].FullName
          if ((Get-FileHash $wheel -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:WHEEL_SHA) {
            throw "Wheel digest mismatch"
          }
          $venv = Join-Path $env:RUNNER_TEMP "reader-venv"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $venv "Scripts/python.exe"
          & $python -m pip install --no-deps $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $env:RUNNER_TEMP
          try {
            @'
          import importlib.metadata
          import pathlib
          import sys
          from ryan_library.functions.RORB import associations, output_reader, parameter_reader, reader_types, readers, result_readers
          assert importlib.metadata.version("ryan-rorb-readers") == "26.11.24.1"
          root = pathlib.Path(sys.prefix).resolve()
          for module in (associations, output_reader, parameter_reader, reader_types, readers, result_readers):
              assert pathlib.Path(module.__file__).resolve().is_relative_to(root)
          raw = (
              "RORBWin Output File\nProgram version 6.45\n"
              "Time increment (hours)= 1\nDuration of calculations: 2\n"
              "Hydrograph summary\nSite Description\n01 Calculated hydrograph, Outlet\n\n"
              "Inc Time Hyd001\n0 0 0\n1 1 12\n2 2 0\n"
          ).encode()
          document = readers.read_rorb_bytes(raw)
          binding = output_reader.bind_output_site_columns(document)
          assert len(binding) == 1
          assert binding[0].site_id == "Hyd0001"
          assert binding[0].site_id_token == "01"
          assert binding[0].column == "Hyd001"
          assert binding[0].physical_name == "Outlet"
          assert document.section("hydrographs_1").source_tokens[1]["Hyd001"] == "12"
          assert document.original_bytes == raw
          print(sys.version, root, "canonical reader installed-wheel smoke PASS")
          '@ | & $python -I -
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

  publish:
    needs: [build, verify]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Chain-Frost/ryan-tools' &&
      github.ref == 'refs/heads/main' &&
      github.sha == inputs.source_sha &&
      vars.RORB_READERS_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
          digest-mismatch: error
      - name: Recheck source, first-project vacancy and wheel hash
        env:
          GH_TOKEN: ${{ github.token }}
          WHEEL_SHA: ${{ needs.build.outputs.wheel_sha }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          python - <<'PY'
          import hashlib
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path
          files = list(Path("dist").iterdir())
          assert len(files) == 1 and files[0].name.endswith(".whl")
          assert hashlib.sha256(files[0].read_bytes()).hexdigest() == os.environ["WHEEL_SHA"]
          try:
              with urllib.request.urlopen("https://pypi.org/pypi/ryan-rorb-readers/json", timeout=30):
                  raise SystemExit("First reader project already exists; refuse upload")
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          PY
      - name: Publish verified standalone wheel via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist/
          attestations: true
          skip-existing: false
