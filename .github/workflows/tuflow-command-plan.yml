name: TUFLOW command-plan contracts

on:
  pull_request:
    paths:
      - "ryan_library/functions/tuflow/command_plan.py"
      - "ryan_library/orchestrators/tuflow/command_preflight.py"
      - "ryan-scripts/TUFLOW-python/model_management/check_tuflow_inputs.py"
      - "tests/functions/tuflow/test_command_plan.py"
      - "tests/orchestrators/tuflow/test_command_preflight*.py"
      - "tests/scripts/tuflow/test_command_preflight_wrapper.py"
      - "ruff.toml"
      - ".github/workflows/tuflow-command-plan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  command-plan:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Initialise required test-data boundary only
        shell: pwsh
        run: |
          git submodule update --init tests/test_data
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install focused tools
        run: python -m pip install pytest ruff==0.16.6
      - name: Test planning without the GIS stack
        run: python -m pytest -q tests/functions/tuflow/test_command_plan.py tests/orchestrators/tuflow/test_command_preflight.py tests/scripts/tuflow/test_command_preflight_wrapper.py
      - name: Check scoped style and retain suggested source on failure
        if: always()
        shell: pwsh
        run: |
          $files = @(
            'ryan_library/functions/tuflow/command_plan.py',
            'ryan_library/orchestrators/tuflow/command_preflight.py',
            'ryan-scripts/TUFLOW-python/model_management/check_tuflow_inputs.py',
            'tests/functions/tuflow/test_command_plan.py',
            'tests/orchestrators/tuflow/test_command_preflight.py',
            'tests/orchestrators/tuflow/test_command_preflight_real.py',
            'tests/scripts/tuflow/test_command_preflight_wrapper.py'
          )
          python -m ruff check @files
          $lint = $LASTEXITCODE
          python -m ruff format --check @files
          $format = $LASTEXITCODE
          if ($lint -ne 0 -or $format -ne 0) {
            # Only the disposable CI checkout is changed. Never commit these suggestions.
            python -m ruff check --fix @files
            python -m ruff format @files
            python -c "import os,sys,zipfile; p=os.path.join(os.environ['RUNNER_TEMP'],'command-plan-sources.zip'); z=zipfile.ZipFile(p,'w'); [z.write(f,f) for f in sys.argv[1:]]; z.close()" @files
            exit 1
          }
      - name: Retain reviewable formatting suggestions
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: command-plan-formatting-suggestions
          path: ${{ runner.temp }}/command-plan-sources.zip
          if-no-files-found: ignore
