name: PyTUFLOW public batch-validation smoke

on:
  pull_request:
    paths:
      - ".github/workflows/tuflow-batch-smoke.yml"
      - "repo-scripts/pytuflow-requirement.txt"
      - "requirements.txt"
      - "repo-scripts/install_latest_wheel.py"
      - "ryan_library/functions/tuflow/pytuflow_compatibility.py"
      - "ryan_library/orchestrators/tuflow/input_preflight.py"
      - "tests/functions/tuflow/test_pytuflow_compatibility.py"
      - "tests/orchestrators/tuflow/test_input_preflight.py"
      - "tests/repo_scripts/test_install_latest_wheel.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-public-validation:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install immutable accepted PyTUFLOW PR17 source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r repo-scripts/pytuflow-requirement.txt
      - name: Install consumer without optional full GIS project extras
        # Normal GIS-wheel bootstrap is exercised separately by install_latest_wheel.
        run: |
          python -m pip install -e . --no-deps
          python -m pip install pytest
      - name: Require public API capabilities without model I/O
        run: >
          python -c "from ryan_library.functions.tuflow.pytuflow_compatibility import
          require_validation_api; print(require_validation_api().diagnostic.message)"
      - name: Check real public API, fail-closed mapping and installer dry-runs
        run: >
          python -m pytest -q
          tests/functions/tuflow/test_pytuflow_compatibility.py
          tests/orchestrators/tuflow/test_input_preflight.py
          tests/repo_scripts/test_install_latest_wheel.py
