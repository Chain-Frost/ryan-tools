name: Deferred PyTUFLOW consumer

on:
  pull_request:
    paths:
      - ".github/workflows/deferred-pytuflow-consumer.yml"
      - "ryan_library/orchestrators/tuflow/input_preflight.py"
      - "ryan_library/functions/tuflow/dependency_index.py"
      - "ryan_library/functions/tuflow/gis_attribute_dependencies.py"
      - "ryan_library/functions/tuflow/raster_metadata_dependencies.py"
      - "tests/functions/tuflow/test_raster_metadata_dependencies.py"
      - "tests/functions/tuflow/test_gis_attribute_dependencies.py"
      - "tests/fixtures/tuflow_example_repro/run_checks.py"
      - "tests/orchestrators/tuflow/test_input_preflight.py"
      - "typings/pytuflow/__init__.pyi"
  workflow_dispatch:

jobs:
  fork-consumer-smoke:
    runs-on: windows-latest
    env:
      RYAN_TEST_DEFERRED_PYTUFLOW: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialise required test-data submodule
        run: git submodule update --init tests/test_data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install ryan-tools development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Replace published PyTUFLOW with pinned deferred fork
        run: python -m pip install --no-deps --force-reinstall "git+https://github.com/phantom-branch/PyTuflow.git@4228a805687cfd80d98a27e2ebcb62c234b40059"
      - name: Verify fork deferred API and consumer regression tests
        run: python -m pytest -q tests/orchestrators/tuflow/test_input_preflight.py tests/functions/tuflow/test_gis_attribute_dependencies.py tests/functions/tuflow/test_raster_metadata_dependencies.py
      - name: Replay archived Shapefile examples without launching TUFLOW
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "tuflow-example-shapefile-replay"
          python -m tests.fixtures.tuflow_example_repro.run_checks --tcf EG02_014.tcf --tcf EG04_004.tcf --output $report
          $diagnosticExit = $LASTEXITCODE
          Write-Host "Example replay exit code: $diagnosticExit (1 is expected while other input categories remain unresolved)"
          python -c 'import json,sys; from pathlib import Path; rows=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")); print(json.dumps(rows,indent=2)); assert len(rows)==2; assert next(row for row in rows if row["tcf"]=="EG02_014.tcf")["accepted_parity"]; assert not any("GIS attribute scan currently supports GeoPackage sources only" in issue for row in rows for issue in row.get("preflight_reasons",{}))' (Join-Path $report "results.json")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Full archived example sweep (temporary diagnostic; remove before merge)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "tuflow-example-full-replay"
          python -m tests.fixtures.tuflow_example_repro.run_checks --output $report
          $diagnosticExit = $LASTEXITCODE
          Write-Host "Complete example replay exit code: $diagnosticExit (incomplete supported categories are expected)"
          python -c 'import json,sys; from pathlib import Path; rows=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")); passed=sum(bool(row.get("accepted_parity")) for row in rows); print(f"Full replay: {passed} accepted, {len(rows)-passed} unresolved, {sum(row["runs"] for row in rows)} run combinations"); assert len(rows)==161' (Join-Path $report "results.json")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save complete temporary example results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tuflow-example-full-replay
          path: ${{ runner.temp }}/tuflow-example-full-replay
          if-no-files-found: warn
