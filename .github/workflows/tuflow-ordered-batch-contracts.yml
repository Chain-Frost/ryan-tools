name: PyTUFLOW ordered batch consumer contracts

on:
  pull_request:
    paths:
      - ".github/workflows/tuflow-ordered-batch-contracts.yml"
      - "ryan_library/orchestrators/tuflow/batch_preflight_adapter.py"
      - "ryan_library/orchestrators/tuflow/input_preflight.py"
      - "tests/orchestrators/tuflow/test_ordered_batch_adapter.py"
      - "tests/orchestrators/tuflow/test_batch_preflight_adapter.py"
      - "tests/fixtures/tuflow_example_repro/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-ordered-batch:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ryan-tools
    env:
      RYAN_TEST_BATCH_PYTUFLOW: "1"
      PYTUFLOW_TEST_SHA: e162c04330d24c37bee3ade94479cc4602651060
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: ryan-tools
          submodules: false
      - name: Check out the frozen parser baseline separately
        uses: actions/checkout@v6
        with:
          repository: phantom-branch/PyTuflow
          ref: e162c04330d24c37bee3ade94479cc4602651060
          path: pytuflow-graph-baseline
          submodules: false
      - name: Initialise required public TUFLOW tutorial data
        run: git submodule update --init tests/test_data
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install the frozen parser's supported GIS dependencies
        # This diagnostic-only checkout does not change the published dependency.
        run: python -m pip install ../pytuflow-graph-baseline
      - name: Install isolated preflight consumer and test dependencies
        run: |
          python -m pip install -e . --no-deps
          python -m pip install pytest pyshp loguru pandas psutil "ruff==0.16.6" pyright pandas-stubs
      - name: Record and verify exact parser and consumer source revisions
        shell: pwsh
        run: |
          git rev-parse HEAD
          git -C tests/test_data rev-parse HEAD
          $parserHead = git -C ../pytuflow-graph-baseline rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($parserHead -ne $env:PYTUFLOW_TEST_SHA) { throw "Unexpected parser revision: $parserHead" }
          Write-Output "PyTUFLOW source: $parserHead"
      - name: Check changed diagnostic Python on Windows
        shell: pwsh
        run: |
          $files = @("tests/fixtures/tuflow_example_repro/run_checks.py", "tests/fixtures/tuflow_example_repro/run_local_checks.py", "tests/fixtures/tuflow_example_repro/test_run_local_checks.py")
          python -m ruff check @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff format --check @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pyright @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify ordered, legacy and fail-closed contract tests
        run: >
          python -m pytest -q
          tests/orchestrators/tuflow/test_batch_preflight_adapter.py
          tests/orchestrators/tuflow/test_ordered_batch_adapter.py
          tests/fixtures/tuflow_example_repro/test_run_checks.py
          tests/fixtures/tuflow_example_repro/test_run_local_checks.py
      - name: Verify the native four-mode CLI is available
        run: python -m tests.fixtures.tuflow_example_repro.run_local_checks --help
      - name: Replay all 161 TCFs and 174 runs in the four diagnostic modes
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "ordered-batch-tutorial-replay"
          python -m tests.fixtures.tuflow_example_repro.run_checks --batch --graph-compare --pytuflow-checkout ../pytuflow-graph-baseline --output $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c 'import json,sys; from pathlib import Path; rows=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")); modes=("eager","deferred","batch_graph_off","batch_graph_on"); counts=("missing","extra","batch_graph_off_missing","batch_graph_off_extra","batch_graph_on_missing","batch_graph_on_extra","graph_missing","graph_extra"); assert len(rows)==161 and sum(row["runs"] for row in rows)==174; assert all(row.get("accepted_parity") and row.get("preflight_passed") and row.get("batch_preflight_passed") and row.get("public_preflight")=={"timed":False,"batch_graph_policy":"parser_default","graph_comparison":False} and row.get("reference_provenance_equal") is True and row.get("graph_provenance_equal") is True and all(row.get(key)==0 for key in counts) and all(mode in row and row[mode].get("collection_issues")==0 and row[mode].get("inventory_issues")==0 and not row[mode].get("error") for mode in modes) for row in rows), "Incomplete four-mode materialisation or public-preflight parity"' (Join-Path $report "results.json")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload public diagnostic parity results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ordered-batch-tutorial-parity
          path: ${{ runner.temp }}/ordered-batch-tutorial-replay
          if-no-files-found: warn
