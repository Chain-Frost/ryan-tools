name: Python CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Preserve every main push revision, including pending runs needed for release finalization.
  # A shared main group with cancellation disabled would still replace pending runs.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  policy:
    name: Policy
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Initialise required vendored packages
        shell: pwsh
        run: |
          git submodule sync -- vendor/run_hy8 vendor/ryan_culverts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule update --init vendor/run_hy8 vendor/ryan_culverts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Check GitHub Actions workflows
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'actionlint'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          gh release download v1.7.12 --repo rhysd/actionlint --pattern 'actionlint_1.7.12_windows_amd64.zip' --dir $directory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Join-Path $directory 'actionlint_1.7.12_windows_amd64.zip'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '6E7241B51E6817EA6A047693D8E6FED13B31819C9A0DD6C5A726E1592D22F6E9') {
            throw 'Actionlint archive checksum mismatch.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          & (Join-Path $directory 'actionlint.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Type-check changed Python files
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          $base = $env:BASE_SHA
          if (-not $base -or $base -match '^0+$') {
            $base = git rev-parse "$env:GITHUB_SHA^"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          $pythonFiles = @(
            git diff --name-only --diff-filter=ACMR "$base...$env:GITHUB_SHA" -- "*.py" |
              Where-Object {
                $_ -and
                $_ -notmatch '^(vendor|tests/test_data|unsorted|qgis-resources|excel-resources)/'
              }
          )
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if ($pythonFiles.Count -eq 0) {
            Write-Host "No changed first-party Python files."
            exit 0
          }

          # Only Python changes need the full import environment for strict Pyright.
          python repo-scripts/install_latest_wheel.py --dependencies-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "Type-checking changed Python files:"
          $pythonFiles | ForEach-Object { Write-Host " - $_" }

          python -m pyright $pythonFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check documentation and logging policy
        shell: pwsh
        run: |
          python repo-scripts/check_documentation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python repo-scripts/check_loguru_formatting.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  python313-mcp-smoke:
    name: Python 3.13 compatibility and MCP
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialise package resources
        shell: pwsh
        run: |
          git submodule sync -- qgis-resources vendor/run_hy8 vendor/ryan_culverts tests/test_data
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule update --init qgis-resources vendor/run_hy8 vendor/ryan_culverts tests/test_data
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check Python 3.13 source compatibility
        shell: pwsh
        run: |
          python -m compileall -q ryan_library
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install package and MCP dependencies
        shell: pwsh
        run: |
          python -m pip install ".[mcp]" pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Python 3.13 focused utility regression tests
        shell: pwsh
        env:
          MPLBACKEND: Agg
        run: |
          # The vendored run_hy8 reader requires Python 3.14; its HY-8 tests remain in the hosted 3.14 suite.
          python -m pytest `
            tests/functions/RORB/test_read_rorb_files.py `
            tests/functions/gdal/test_profiling.py `
            tests/functions/test_process_12D_culverts.py `
            tests/functions/tuflow/test_logsummary_excel_append.py `
            tests/functions/tuflow/test_notebook_helpers.py `
            tests/functions/tuflow/test_po_timeseries_checks.py `
            -m "not gui and not external"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify MCP module import and tool exports
        shell: pwsh
        env:
          RYAN_MCP_PROFILE: create
          RYAN_TOOLS_REPOSITORY_ROOT: ${{ github.workspace }}
        run: |
          python -B -c "import ryan_library.mcp.server as server; assert server.mcp is not None; assert all(callable(getattr(server, name)) for name in ('parse_tuflow_filename', 'inspect_tuflow_result', 'inspect_tuflow_collection', 'inspect_raster_metadata', 'check_repo_health', 'list_workflows', 'get_workflow'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  hosted-tests:
    name: Hosted tests
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      MPLBACKEND: Agg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialise required test submodules
        shell: pwsh
        run: |
          git submodule sync -- qgis-resources vendor/run_hy8 vendor/ryan_culverts tests/test_data
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule update --init qgis-resources vendor/run_hy8 vendor/ryan_culverts tests/test_data
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install development dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python repo-scripts/install_latest_wheel.py --dependencies-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run hosted test boundary
        # Temporarily exclude two slow sweeps; see docs/work/2026-10-15-release-automation.md.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-results | Out-Null
          python -m pytest tests `
            --ignore=tests/functions/gdal `
            --ignore=tests/orchestrators/gdal `
            --ignore=tests/scripts/gdal/test_gdal_flood_extent.py `
            --ignore=tests/scripts/test_promoted_utilities.py `
            --ignore=tests/scripts/test_archive_compress.py `
            -m "not gdal and not gui and not external" `
            --deselect=tests/floodway/test_sweep.py::test_discharge_sweep_detects_overtopping_and_retains_non_aep_interior_states `
            --deselect=tests/floodway/test_sweep.py::test_discharge_sweep_honours_explicit_minimum_bound `
            -rs `
            --junitxml=test-results/hosted-tests.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-test-report
          path: test-results/hosted-tests.xml
          if-no-files-found: warn

  package:
    name: Package
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialise package resources
        shell: pwsh
        run: |
          git submodule sync -- qgis-resources vendor/run_hy8 vendor/ryan_culverts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule update --init qgis-resources vendor/run_hy8 vendor/ryan_culverts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install packaging and smoke-test dependencies
        shell: pwsh
        run: |
          # Public run_hy8 imports pandas and Loguru; remaining smoke operations use stdlib.
          python -m pip install build pandas loguru
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify retained wheel
        shell: pwsh
        run: |
          python repo-scripts/verify_wheel.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rebuild current version and verify
        shell: pwsh
        run: |
          $before = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python repo-scripts/build_library.py --no-bump --skip-pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $after = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($before -ne $after) {
            throw "No-bump package verification changed the declared version: $before -> $after"
          }

      - name: Smoke-test isolated installed wheel
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "ryan-functions-wheel-install"
          Remove-Item -Recurse -Force $target -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $target | Out-Null

          $wheel = @(Get-ChildItem -LiteralPath dist -Filter "ryan_functions-*.whl" -File)
          if ($wheel.Count -ne 1) { throw "Expected exactly one retained ryan_functions wheel." }

          python -m pip install --no-deps --target $target $wheel[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $env:PYTHONPATH = $target
          Push-Location $env:RUNNER_TEMP
          try {
            python "$env:GITHUB_WORKSPACE/repo-scripts/smoke_test_installed_wheel.py" --expected-root $target
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Upload verified wheel
        uses: actions/upload-artifact@v7
        with:
          name: verified-ryan-functions-wheel
          path: dist/ryan_functions-*.whl
          if-no-files-found: error
