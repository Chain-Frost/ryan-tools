name: Python CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Preserve every main push revision, including pending runs needed for release finalization.
  # A shared main group with cancellation disabled would still replace pending runs.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  fast-checks:
    # Keep the existing required-check name while making it a real prerequisite.
    name: Ruff and whitespace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full: ${{ steps.scope.outputs.full }}
      has_types: ${{ steps.scope.outputs.type_files != '[]' }}
    steps:
      - name: Checkout repository with comparison history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.14 for inexpensive checks
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify accepted PyTuflow wheel before expensive native work
        run: python repo-scripts/vendor_pytuflow_wheel.py

      - name: Determine complete PR scope and static-check inputs
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}
          CI_SCOPE_PATH: ${{ runner.temp }}/ci-scope.json
        run: python repo-scripts/ci_scope.py

      - name: Check patch whitespace
        if: steps.scope.outputs.comparison_available == 'true'
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}
        run: |
          git diff --check "$env:BASE_SHA" "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Explain full-validation fallback
        if: steps.scope.outputs.comparison_available != 'true'
        run: echo "::warning::Change comparison unavailable; checking all first-party static inputs and running full validation. Patch whitespace cannot be compared."

      - name: Install only the repository-pinned Ruff
        if: steps.scope.outputs.lint_files != '[]'
        shell: pwsh
        run: |
          $requirement = python -c "import tomllib; print(next(x for x in tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']['dev'] if x.startswith('ruff==')))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install $requirement
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ruff lint and formatting before native installations
        if: steps.scope.outputs.lint_files != '[]'
        shell: pwsh
        run: |
          $scope = Get-Content (Join-Path $env:RUNNER_TEMP 'ci-scope.json') -Raw | ConvertFrom-Json
          $pythonFiles = @($scope.lint_files)
          python -m ruff check -- $pythonFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff format --check -- $pythonFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check GitHub Actions workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          directory="$RUNNER_TEMP/actionlint"
          mkdir -p "$directory"
          gh release download v1.7.12 --repo rhysd/actionlint --pattern 'actionlint_1.7.12_linux_amd64.tar.gz' --dir "$directory"
          archive="$directory/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$directory" actionlint
          "$directory/actionlint" -ignore 'unexpected key "queue" for "concurrency" section'

      - name: Check documentation and logging policy
        shell: pwsh
        run: |
          python repo-scripts/check_documentation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python repo-scripts/check_documentation.py --links-only docs/MCP_SETUP.md docs/mcp-handoff/README.md docs/work/README.md docs/work/2026-11-01-mcp-workflow-discovery-136.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $scope = Get-Content (Join-Path $env:RUNNER_TEMP 'ci-scope.json') -Raw | ConvertFrom-Json
          $markdownFiles = @($scope.markdown_files)
          if ($markdownFiles.Count -gt 0) {
            python repo-scripts/check_documentation.py --links-only $markdownFiles
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python repo-scripts/check_loguru_formatting.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  posix-wrapper-security:
    needs: [fast-checks]
    # Unknown scope requests full validation; a failed required preflight blocks merging.
    if: ${{ !cancelled() && needs.fast-checks.result == 'success' && needs.fast-checks.outputs.full != 'false' }}
    name: POSIX wrapper security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install focused test dependency
        run: python -m pip install pytest

      - name: Check every installed-script static inventory entry
        run: |
          python repo-scripts/audit_installed_scripts.py --check --output "${{ runner.temp }}/installed-scripts-audit.json"
          python repo-scripts/audit_installed_scripts.py --format markdown --output "${{ runner.temp }}/installed-scripts-audit.md"

      - name: Publish file-by-file audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installed-script-audit
          retention-days: 7
          path: |
            ${{ runner.temp }}/installed-scripts-audit.json
            ${{ runner.temp }}/installed-scripts-audit.md
          if-no-files-found: warn

      - name: Test CAD SQLite publication on POSIX
        # These tests exercise real SQLite locks/journals without GDAL or fixtures.
        run: python -m pytest -q tests/test_cad_to_gpkg.py -k overwrite --noconftest

      - name: Test descriptor-based staging and cleanup
        # The regular hosted suite runs on Windows, where these POSIX-only
        # regression tests would otherwise be skipped. These tests need no
        # GIS dependencies or large test-data submodules.
        run: python -m pytest -q tests/mcp/test_installed_scripts.py --confcutdir=tests/mcp

  policy:
    needs: [fast-checks]
    if: ${{ !cancelled() }}
    name: Policy
    # Native imports/types use Windows; documentation-only acknowledgement is cheap.
    runs-on: ${{ needs.fast-checks.result == 'success' && needs.fast-checks.outputs.has_types == 'true' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Require successful preflight
        shell: bash
        env:
          PREFLIGHT_RESULT: ${{ needs.fast-checks.result }}
        run: test "$PREFLIGHT_RESULT" = success

      - name: Checkout repository
        if: needs.fast-checks.outputs.has_types == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        if: needs.fast-checks.outputs.has_types == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            repo-scripts/ci-policy-requirements.txt
            repo-scripts/install_latest_wheel.py
            repo-scripts/ci_gis_bootstrap.py
            repo-scripts/pytuflow-requirement.txt
            repo-scripts/vendor_pytuflow_wheel.py
            repo-scripts/wheels/pytuflow/**/provenance.json
            repo-scripts/wheels/pytuflow/**/*.whl

      - name: Recompute static inputs without large environment variables
        if: needs.fast-checks.outputs.has_types == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}
          CI_SCOPE_PATH: ${{ runner.temp }}/ci-scope.json
        run: python repo-scripts/ci_scope.py

      - name: Check changed Python types in the Windows import environment
        if: needs.fast-checks.outputs.has_types == 'true'
        shell: pwsh
        run: |
          $scope = Get-Content (Join-Path $env:RUNNER_TEMP 'ci-scope.json') -Raw | ConvertFrom-Json
          $pythonFiles = @($scope.type_files)
          if ($pythonFiles.Count -eq 0) { throw 'Expected Python inputs from successful preflight.' }
          python repo-scripts/ci_gis_bootstrap.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r repo-scripts/ci-policy-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python repo-scripts/vendor_pytuflow_wheel.py --installed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Ruff, workflow syntax, documentation and logging already passed preflight.
          # Preserve the initialiser's distinct strict GIS stub configuration.
          $initialiserIncludes = @((Get-Content pyright-initialiser.json -Raw | ConvertFrom-Json).include)
          $initialiserFiles = @($pythonFiles | Where-Object {
            $file = $_
            @($initialiserIncludes | Where-Object {
              $file -eq $_ -or $file.StartsWith("$_/")
            }).Count -gt 0
          })
          $sharedFiles = @($pythonFiles | Where-Object { $_ -notin $initialiserFiles })
          # Large configuration changes can select every file. Bound command-line
          # length as well as avoiding Windows' environment-variable length limit.
          $batch = @()
          $characters = 0
          foreach ($file in $sharedFiles) {
            if ($characters + $file.Length + 3 -gt 12000) {
              python -m pyright @batch
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $batch = @()
              $characters = 0
            }
            $batch += $file
            $characters += $file.Length + 3
          }
          if ($batch.Count -gt 0) {
            python -m pyright @batch
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ($initialiserFiles.Count -gt 0) {
            python -m pyright --project pyright-initialiser.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Confirm the required preflight policy result
        run: echo "Ruff, workflow, documentation and logging checks passed before this job."

  mcp-smoke:
    name: MCP smoke
    needs: [fast-checks, hosted-tests]
    if: ${{ !cancelled() && needs.fast-checks.result == 'success' && needs.fast-checks.outputs.full != 'false' }}
    # MCP executes on Windows in Hosted tests. This cheap job preserves the required
    # check and rejects a failed/skipped Windows job or missing explicit evidence.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful Windows MCP and utility acceptance
        env:
          HOSTED_RESULT: ${{ needs.hosted-tests.result }}
          MCP_CONTRACTS: ${{ needs.hosted-tests.outputs.mcp_contracts }}
        run: |
          test "$HOSTED_RESULT" = success
          test "$MCP_CONTRACTS" = true

  hosted-tests:
    needs: [fast-checks]
    # Unknown scope requests full validation; a failed required preflight blocks merging.
    if: ${{ !cancelled() && needs.fast-checks.result == 'success' && needs.fast-checks.outputs.full != 'false' }}
    name: Hosted tests
    outputs:
      mcp_contracts: ${{ steps.mcp-contracts.outputs.passed }}
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      MPLBACKEND: Agg
      # A rerun of the same PR revision keeps complete diagnostics without a new push.
      PYTEST_ADDOPTS: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 && '--maxfail=1' || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialise required test submodules
        shell: pwsh
        run: |
          git submodule sync -- qgis-resources tests/test_data
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule update --init qgis-resources tests/test_data
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            repo-scripts/ci-test-requirements.txt
            repo-scripts/install_latest_wheel.py
            repo-scripts/ci_gis_bootstrap.py
            repo-scripts/pytuflow-requirement.txt
            repo-scripts/vendor_pytuflow_wheel.py
            repo-scripts/wheels/pytuflow/**/provenance.json
            repo-scripts/wheels/pytuflow/**/*.whl

      - name: Compile supported Windows Python sources before installing dependencies
        shell: pwsh
        run: python -m compileall -q ryan_library

      - name: Install binary GIS dependencies
        shell: pwsh
        run: |
          python repo-scripts/ci_gis_bootstrap.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install runtime, MCP and hosted-test dependencies
        shell: pwsh
        run: |
          python -m pip install -r repo-scripts/ci-test-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installed parser wheel origin and SHA-256
        shell: pwsh
        run: |
          python repo-scripts/vendor_pytuflow_wheel.py --installed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run hosted test boundary
        # Temporarily exclude two slow sweeps; see docs/work/2026-10-15-release-automation.md.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-results | Out-Null
          python -m pytest tests `
            --ignore=tests/functions/gdal `
            --ignore=tests/orchestrators/gdal `
            --ignore=tests/scripts/gdal/test_gdal_flood_extent.py `
            --ignore=tests/scripts/gdal/test_cutline_publication_200.py `
            --ignore=tests/scripts/test_promoted_utilities.py `
            --ignore=tests/scripts/test_archive_compress.py `
            -m "not gdal and not gui and not external" `
            --deselect=tests/floodway/test_sweep.py::test_discharge_sweep_detects_overtopping_and_retains_non_aep_interior_states `
            --deselect=tests/floodway/test_sweep.py::test_discharge_sweep_honours_explicit_minimum_bound `
            -rs `
            --durations=15 `
            --junitxml=test-results/hosted-tests.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve the focused profiling regression excluded by the broad GIS boundary
        shell: pwsh
        run: python -m pytest -q tests/functions/gdal/test_profiling.py -m "not gui and not external" --junitxml=test-results/mcp-profiling.xml

      - name: Verify Windows MCP module import and tool exports
        id: mcp-contracts
        shell: pwsh
        env:
          RYAN_MCP_PROFILE: create
          RYAN_TOOLS_REPOSITORY_ROOT: ${{ github.workspace }}
        run: |
          python -B -c "import ryan_library.mcp.server as server; assert server.mcp is not None; assert all(callable(getattr(server, name)) for name in ('parse_tuflow_filename', 'inspect_tuflow_result', 'inspect_tuflow_collection', 'inspect_raster_metadata', 'check_repo_health', 'list_workflows', 'get_workflow'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "passed=true" >> $env:GITHUB_OUTPUT

      # #227: a second pandas major series must preserve POMM/culvert
      # numeric values, representative-event identity and XLSX schemas.
      # Keep the default-environment suite and MCP acceptance above as the primary gates.
      - name: Run focused POMM compatibility tests with pandas 2.3.3
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: "pandas==2.3.3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import pandas as pd; assert pd.__version__ == '2.3.3', pd.__version__; print(f'pandas {pd.__version__}')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q `
            tests/functions/tuflow/test_pomm_pandas_compat_227.py `
            tests/functions/tuflow/test_pomm_peak_inputs_218.py `
            tests/functions/tuflow/test_pomm_finite_populations_216_217.py `
            tests/functions/tuflow/test_pomm_coverage_findings.py `
            tests/scripts/test_pomm_max_items.py `
            tests/functions/tuflow/test_pomm_utils.py `
            tests/orchestrators/tuflow/test_tuflow_culverts_finite_216.py `
            tests/orchestrators/tuflow/test_tuflow_culverts_mean.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-test-report
          retention-days: 7
          path: test-results/*.xml
          if-no-files-found: warn

  package:
    needs: [fast-checks]
    # Unknown scope requests full validation; a failed required preflight blocks merging.
    if: ${{ !cancelled() && needs.fast-checks.result == 'success' && needs.fast-checks.outputs.full != 'false' }}
    name: Package
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialise package resources
        shell: pwsh
        run: |
          git submodule sync -- qgis-resources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule update --init qgis-resources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            repo-scripts/wheel-smoke-requirements.txt

      - name: Install packaging and smoke-test dependencies
        shell: pwsh
        run: |
          python -m pip install build -r repo-scripts/wheel-smoke-requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build fresh current-version wheel and verify
        shell: pwsh
        run: |
          $before = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python repo-scripts/build_library.py --no-bump --skip-pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python repo-scripts/verify_wheel.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $after = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($before -ne $after) {
            throw "No-bump package verification changed the declared version: $before -> $after"
          }

      # Includes copied TUFLOW input-checker help and solver-free runner TXT
      # export, replacing the separate scope-04 wheel smoke workflow.
      - name: Smoke-test isolated installed wheel
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "ryan-tools-wheel-install"
          Remove-Item -Recurse -Force $target -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $target | Out-Null

          $wheel = @(Get-ChildItem -LiteralPath dist -Filter "ryan_tools-*.whl" -File)
          if ($wheel.Count -ne 1) { throw "Expected exactly one freshly built ryan-tools wheel." }

          python -m pip install --no-deps --target $target $wheel[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The ryan-tools wheel no longer contains these separately published packages.
          python -m pip install --no-deps --target $target "run-hy8>=2026.10.16.1" "ryan-culverts>=26.10.16.1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $env:PYTHONPATH = $target
          Push-Location $env:RUNNER_TEMP
          try {
            python "$env:GITHUB_WORKSPACE/repo-scripts/smoke_test_installed_wheel.py" --expected-root $target
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Smoke-test copied log-summary against freshly built wheel
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "ryan-tools-wheel-install"
          $env:PYTHONPATH = $target
          Push-Location $env:RUNNER_TEMP
          try {
            python "$env:GITHUB_WORKSPACE/repo-scripts/smoke_dashboard_installed_wheel.py" --expected-root $target
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Smoke-test six copied TUFLOW result wrappers against installed wheel
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "ryan-tools-wheel-install"
          # Maximums processor package imports pyshp even for CSV-only Cmx.
          # Install into the isolated wheel root; never add checkout imports.
          python -m pip install --no-deps --target $target pyshp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHONPATH = $target
          Push-Location $env:RUNNER_TEMP
          try {
            python "$env:GITHUB_WORKSPACE/repo-scripts/smoke_result_dashboard_installed_wheel.py" --expected-root $target
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Upload verified wheel
        uses: actions/upload-artifact@v7
        with:
          name: verified-ryan-tools-wheel
          retention-days: 14
          path: dist/ryan_tools-*.whl
          if-no-files-found: error
