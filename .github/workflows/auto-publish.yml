name: Release new verified main merges

on:
  workflow_run:
    workflows: [Python CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Only completed post-merge Python CI can initiate a release. No manual or
# scheduled triggers, and no historical backlog scans.
concurrency:
  group: auto-pypi-reconcile-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
    steps:
      - name: Select trusted main CI revision
        id: trusted
        uses: actions/github-script@v8
        with:
          script: |
            const {owner, repo} = context.repo;
            const sha = context.payload.workflow_run.head_sha;
            if (!sha) {
              core.info('No successful main push CI: skipping.');
              core.setOutput('eligible','false');
              return;
            }
            // Refuse revisions preceding the release cutover.
            try {
              await github.rest.repos.getContent({
                owner,repo,path:'.github/release-cutover.md',ref:sha
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('Latest verified revision predates release cutover: skipping.');
              core.setOutput('eligible','false');
              return;
            }
            core.setOutput('eligible','true');
            core.setOutput('sha',sha);
      - name: Check out CI-verified release tooling
        if: steps.trusted.outputs.eligible == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.trusted.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.14
        if: steps.trusted.outputs.eligible == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Publish only the latest new PR merge
        if: steps.trusted.outputs.eligible == 'true'
        uses: actions/github-script@v8
        env:
          TRUSTED_SHA: ${{ steps.trusted.outputs.sha }}
        with:
          script: |
            const {owner,repo} = context.repo;
            const trusted = process.env.TRUSTED_SHA;
            const git = async args => {
              const result = await exec.getExecOutput('git',args,{silent:true});
              if (result.exitCode !== 0) {
                throw new Error('Git command failed: '+ args.join(' '));
              }
              return result.stdout.trim();
            };
            await git(['fetch','--no-tags','origin',
              '+refs/heads/main:refs/remotes/origin/main']);
            const head = await git(['rev-parse','refs/remotes/origin/main']);
            if (head !== trusted) {
              core.info('main advanced while CI was running; skip superseded ' +
                trusted.slice(0,12) + '. Only the new tip can be released.');
              return;
            }
            const anchors = (await git(['log','--first-parent','--diff-filter=A',
              '--format=%H','refs/remotes/origin/main','--',
              '.github/release-cutover.md'])).split(/\r?\n/).filter(Boolean);
            if (anchors.length !== 1) {
              throw new Error('Expected exactly one committed release-cutover introduction.');
            }
            const anchor = anchors[0];
            if (head === anchor) {
              core.info('Cutover merge itself is not a package release.');
              return;
            }
            const ancestry = (await git(['rev-list','--first-parent',
              'refs/remotes/origin/main'])).split(/\r?\n/);
            if (!ancestry.includes(anchor)) {
              throw new Error('Release cutoff was not on first-parent main history.');
            }
            const prs = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {owner,repo,commit_sha:head,per_page:100}
            );
            const merge = prs.find(pr => pr.merged_at &&
              pr.merge_commit_sha === head && pr.base.ref === 'main' &&
              pr.base.repo?.full_name === owner + '/' + repo);
            if (!merge) {
              core.info('Current main commit is not a completed PR merge: no release.');
              return;
            }
            // Evaluate opt-out before creating tags, releases or PyPI artifacts.
            const {data: currentPR} = await github.rest.pulls.get({
              owner,repo,pull_number:merge.number
            });
            if (currentPR.merge_commit_sha !== head || !currentPR.merged_at) {
              throw new Error('Merged PR identity does not match verified main tip.');
            }
            const {data: sourceCommit} = await github.rest.repos.getCommit({
              owner,repo,ref:head
            });
            const decision = await exec.getExecOutput('python3',[
              'repo-scripts/release_skip_policy.py'
            ],{
              input:Buffer.from(JSON.stringify({
                labels:currentPR.labels.map(label => label.name),
                commit_message:sourceCommit.commit.message
              }),'utf8'),silent:true
            });
            if (decision.exitCode !== 0) {
              throw new Error('Release opt-out validation failed; refusing to tag.');
            }
            const choice = decision.stdout.trim();
            if (choice === 'skip') {
              core.info('PR #' + merge.number + ': release explicitly skipped.');
              return;
            }
            if (choice !== 'publish') throw new Error('Invalid release decision: ' + choice);
            // Only the verified tip is eligible; no catch-up releases for earlier
            // source commits, regardless of CI completion ordering.
            const tags = (await github.paginate(github.rest.repos.listTags,
              {owner,repo,per_page:100}))
              .filter(tag => /^v(?:\d{2}|\d{4})\.\d+\.\d+\.[1-9]\d*$/.test(tag.name));
            const existingAtHead = tags.filter(tag => tag.commit.sha === head);
            if (existingAtHead.length > 1) {
              throw new Error('Multiple release tags on the same main revision.');
            }
            const published = async tag => {
              const response = await fetch('https://pypi.org/pypi/ryan-tools/' +
                encodeURIComponent(tag.slice(1)) + '/json',
                {signal:AbortSignal.timeout(30000)});
              await response.body?.cancel();
              if (response.status !== 404 && !response.ok) {
                throw new Error('PyPI availability failed: HTTP ' + response.status);
              }
              return response.ok;
            };
            let tag = existingAtHead[0]?.name;
            if (!tag) {
              const {data: file} = await github.rest.repos.getContent({
                owner,repo,path:'pyproject.toml',ref:head
              });
              const toml = Buffer.from(file.content,'base64').toString('utf8');
              const section = /^\[project\][ \t]*$/m.exec(toml);
              if (!section) throw new Error('Missing pyproject.toml [project].');
              const block = toml.slice(section.index + section[0].length)
                .split(/^\[[^\r\n]+\][ \t]*$/m)[0];
              const current = block.match(/^version[ \t]*=[ \t]*"([^"]+)"/m)?.[1];
              if (!current) throw new Error('Missing source project version.');
              const history = await fetch('https://pypi.org/pypi/ryan-tools/json',
                {signal:AbortSignal.timeout(30000)});
              let versions = [];
              if (history.ok) versions = Object.keys((await history.json()).releases || {});
              else if (history.status !== 404) {
                throw new Error('PyPI version history unavailable.');
              }
              const perth = new Intl.DateTimeFormat('en-GB',{
                timeZone:'Australia/Perth',year:'numeric',month:'2-digit',
                day:'2-digit'
              }).formatToParts(new Date());
              const part = key => perth.find(p => p.type === key)?.value;
              const today = [part('year'),part('month'),part('day')].join('-');
              const request = JSON.stringify({
                current, versions:[...versions,...tags.map(t => t.name.slice(1))],today
              });
              const planned = await exec.getExecOutput('python3',[
                'repo-scripts/auto_release_version.py','next'
              ],{input:Buffer.from(request,'utf8'),silent:true});
              if (planned.exitCode !== 0) throw new Error('Version allocation failed.');
              tag = 'v' + planned.stdout.trim();
              if (!/^v(?:\d{2}|\d{4})\.\d+\.\d+\.[1-9]\d*$/.test(tag)) {
                throw new Error('Invalid automatically allocated release tag: ' + tag);
              }
              // Recheck the tip before creating a tag (CI may finish out of order).
              const {data:now} = await github.rest.git.getRef({
                owner,repo,ref:'heads/main'
              });
              if (now.object.sha !== head) {
                core.info('main moved during version allocation: skip old commit.');
                return;
              }
              await github.rest.git.createRef({
                owner,repo,ref:'refs/tags/' + tag,sha:head
              });
              core.info('Reserved new-merge release '+tag+' at '+head);
            }
            // Successful completion now triggers the trusted publisher via
            // workflow_run: no workflow_dispatch and no polling.
            if (await published(tag)) {
              core.info('Already published: ' + tag);
              return;
            }
            const {data:tagRef} = await github.rest.git.getRef({
              owner,repo,ref:'tags/' + tag
            });
            if (tagRef.object.type !== 'commit' || tagRef.object.sha !== head) {
              throw new Error('Release tag does not identify the verified main merge.');
            }
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({
                owner,repo,tag
              })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (!release) {
              release = (await github.rest.repos.createRelease({
                owner,repo,tag_name:tag,target_commitish:head,name:tag,
                draft:false,prerelease:false,generate_release_notes:true,
                body:'Automatic release for the current, CI-verified main PR merge ' +
                  head + '. No historical source commits were backfilled.'
              })).data;
            }
            if (release.draft || release.prerelease || !release.published_at) {
              throw new Error('Release must be a published stable GitHub Release.');
            }
            core.info('GitHub Release ' + tag +
              ' is ready; only workflow_run may initiate its PyPI publisher.');
