name: One-off retained wheel refresh for PR 116
on:
  push:
    branches:
      - feature/shared-tuflow-verification-110
    paths:
      - .github/workflows/refresh-wheel-pr116.yml
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'Chain-Frost/ryan-tools'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install build tools
        run: python -m pip install --upgrade build setuptools wheel
      - name: Rebuild and verify retained wheel
        run: |
          python repo-scripts/build_library.py --version 26.10.15.3 --skip-pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python repo-scripts/verify_wheel.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh
      - name: Commit verified wheel
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pyproject.toml dist/
          if (-not (git status --porcelain)) { throw "Expected updated version and retained wheel" }
          git commit -m "build: retain verified wheel 26.10.15.3 for PR 116"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:feature/shared-tuflow-verification-110
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
