# Temporary branch-local formatter; remove after applying scope 03 formatting.
name: Scope 03 branch-local format
on:
  push:
    branches:
      - feat/tuflow-runner-scope03-20261031
    paths:
      - '.github/workflows/scope03-format-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          submodules: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install ruff==0.16.6
      - name: Format exact owned paths only
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check --fix ryan_library/orchestrators/tuflow/simulation_runner.py ryan-scripts/TUFLOW-python/model_management/run_tuflow_simulations.py tests/orchestrators/tuflow/test_simulation_runner.py tests/scripts/test_run_tuflow_simulations.py tests/scripts/test_tuflow_advisory_runner.py || true
          python -m ruff format ryan_library/orchestrators/tuflow/simulation_runner.py ryan-scripts/TUFLOW-python/model_management/run_tuflow_simulations.py tests/orchestrators/tuflow/test_simulation_runner.py tests/scripts/test_run_tuflow_simulations.py tests/scripts/test_tuflow_advisory_runner.py
          git add -- ryan_library/orchestrators/tuflow/simulation_runner.py ryan-scripts/TUFLOW-python/model_management/run_tuflow_simulations.py tests/orchestrators/tuflow/test_simulation_runner.py tests/scripts/test_run_tuflow_simulations.py tests/scripts/test_tuflow_advisory_runner.py
          if ! git diff --cached --quiet; then
            git -c user.name='scope03-ci' -c user.email='scope03-ci@users.noreply.github.com' commit -m '[tuflow] Apply Ruff formatting to scoped runner files'
            git push origin HEAD:refs/heads/feat/tuflow-runner-scope03-20261031
          fi
