name: PR 100 Package Refresh

on:
  push:
    branches:
      - feature/issue-99-tuflow-culvert-engines

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[package-refresh]') }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Initialise package resources
        shell: pwsh
        run: |
          git submodule sync -- qgis-resources vendor/run_hy8 vendor/ryan_culverts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule update --init qgis-resources vendor/run_hy8 vendor/ryan_culverts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install build frontend
        shell: pwsh
        run: |
          python -m pip install --upgrade build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build incremented package
        shell: pwsh
        run: |
          python repo-scripts/build_library.py --skip-pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit package refresh
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pyproject.toml dist/ryan_functions-*.whl
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Package artifacts are already current."
            exit 0
          }
          git commit -m "[package-refresh] rebuild retained package"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
