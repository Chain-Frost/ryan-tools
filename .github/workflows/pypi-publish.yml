name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Repeated requests for a given tag can coalesce. The durable backlog
# worker sequences DIFFERENT tags and cannot drop an intermediate commit.
concurrency:
  group: pypi-${{ github.repository }-${{ github.ref }
  cancel-in-progress: false

jobs:
  release:
    name: Validate stable tag and publication state
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }
      sha: ${{ steps.plan.outputs.sha }
      publish: ${{ steps.plan.outputs.publish }
    steps:
      - name: Validate tagged release
        id: plan
        uses: actions/github-script@v8
        with:
          script: |
            const {owner, repo} = context.repo;
            if (!/^refs\/tags\/v(?:\d{2}|\d{4})\.\d+\.\d+\.[1-9]\d*$/.test(context.ref)) {
              throw new Error('PyPI publication requires an existing stable calendar-version tag.');
            }
            const tag = context.ref.slice('refs/tags/'.length);
            const version = tag.slice(1);
            const numeric = value => {
              if (!/^(?:\d{2}|\d{4})\.\d{1,2}\.\d{1,2}\.[1-9]\d*$/.test(value)) {
                throw new Error('Unrecognized historical version ' + value);
              }
              const pieces = value.split('.').map(Number);
              if (pieces[0] < 100) pieces[0] += 2000;
              return pieces;
            };
            const cmp = (a,b) => {
              const lhs = numeric(a), rhs = numeric(b);
              for (let i=0; i<4; i++) if (lhs[i] !== rhs[i]) return lhs[i] - rhs[i];
              return 0;
            };
            const {data: release} = await github.rest.repos.getReleaseByTag({owner, repo, tag});
            if (release.draft || release.prerelease || !release.published_at || release.tag_name !== tag) {
              throw new Error('A published stable GitHub Release for this exact tag is required.');
            }
            const {data: gitTag} = await github.rest.git.getRef({owner, repo, ref: 'tags/' + tag});
            if (gitTag.object.type !== 'commit') throw new Error('Expected a lightweight source commit tag.');
            const sha = gitTag.object.sha;
            const {data: ancestry} = await github.rest.repos.compareCommits({
              owner, repo, base: sha, head: 'main'
            });
            if (!['ahead','identical'].includes(ancestry.status)) {
              throw new Error('Release tag must identify a main ancestor.');
            }
            const {data: file} = await github.rest.repos.getContent({
              owner, repo, path: 'pyproject.toml', ref: sha
            });
            const toml = Buffer.from(file.content, 'base64').toString('utf8');
            const projectPart = toml.match(/^\[project\]\s*\n([\s\S]*?)(?=^\[|\s*$)/m)?.[1];
            const projectVersion = projectPart?.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
            if (!projectVersion || cmp(version, projectVersion) < 0) {
              throw new Error('Tagged release version predates the source project version.');
            }
            const response = await fetch(
              'https://pypi.org/pypi/ryan-functions/json', {signal: AbortSignal.timeout(30000)}
            );
            let history = {};
            if (response.ok) history = (await response.json()).releases || {};
            else if (response.status !== 404) throw new Error('PyPI unavailable: HTTP ' + response.status);
            const existing = Object.keys(history);
            // A historical, already-published tag is an idempotent no-op on rerun.
            const isPublished = existing.some(item => cmp(item, version) === 0);
            if (!isPublished && existing.some(item => cmp(item, version) > 0)) {
              throw new Error('A newer PyPI version exists; refusing the older unpublished release.');
            }
            core.setOutput('tag',tag);
            core.setOutput('sha',sha);
            core.setOutput('publish',isPublished ? 'false' : 'true');
            core.info(isPublished ? 'Already published; no upload.' : 'Ready to publish ' + tag);

  build:
    name: Build and verify distribution
    needs: [release]
    if: needs.release.outputs.publish == 'true'
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Require a published stable GitHub Release
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
        uses: actions/github-script@v8
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const {data: release} = await github.rest.repos.getReleaseByTag({
              ...context.repo, tag
            });
            const ref = await github.rest.git.getRef({...context.repo, ref: 'tags/' + tag});
            if (ref.data.object.sha !== process.env.RELEASE_SHA) {
              throw new Error('Tag does not point to the exact CI-verified source commit.');
            }
            if (release.tag_name !== tag || release.draft || release.prerelease || !release.published_at) {
              throw new Error(`Tag ${tag} must have a published, non-draft, non-prerelease GitHub Release.`);
            }
            core.info(`Verified published stable release ${release.html_url}`);

      - name: Check out release revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.release.outputs.sha }}

      - name: Initialise required package submodules
        shell: pwsh
        run: |
          git submodule sync -- qgis-resources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule update --init qgis-resources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Verify release commit is on main
        shell: pwsh
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git merge-base --is-ancestor "$(git rev-parse HEAD)" refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release commit $env:GITHUB_SHA is not an ancestor of origin/main; refusing PyPI publication."
          }

      - name: Stamp version from verified release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          python repo-scripts/auto_release_version.py stamp "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate release tag and project version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          @'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as file:
              version = tomllib.load(file)["project"]["version"]
          expected_tag = f"v{version}"
          actual_tag = os.environ["RELEASE_TAG"]
          if actual_tag != expected_tag:
              raise SystemExit(f"Release tag {actual_tag!r} must match {expected_tag!r}")
          print(f"Verified release {actual_tag}")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install packaging tools
        shell: pwsh
        run: |
          python -m pip install --upgrade build setuptools wheel twine pandas loguru
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and verify current version
        shell: pwsh
        run: |
          python repo-scripts/build_library.py --no-bump --skip-pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheels = @(Get-ChildItem -LiteralPath dist -Filter 'ryan_functions-*.whl' -File)
          if ($wheels.Count -ne 1) { throw 'Expected exactly one distribution wheel.' }
          python -m twine check $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Reject dependencies unsupported by PyPI
        shell: pwsh
        run: |
          @'
          import email.parser
          import pathlib
          import zipfile
          from packaging.requirements import Requirement

          wheels = list(pathlib.Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit("Expected exactly one wheel")
          with zipfile.ZipFile(wheels[0]) as archive:
              metadata = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
              if len(metadata) != 1:
                  raise SystemExit("Expected exactly one metadata file")
              message = email.parser.BytesParser().parsebytes(archive.read(metadata[0]))
          for value in message.get_all("Requires-Dist", []):
              if Requirement(value).url is not None:
                  raise SystemExit(f"PyPI rejects URL dependencies, including extras: {value}")
          print("PyPI dependency metadata verified")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test the distribution to be published
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP ('pypi-wheel-' + [guid]::NewGuid().ToString('N'))
          $wheels = @(Get-ChildItem -LiteralPath dist -Filter 'ryan_functions-*.whl' -File)
          if ($wheels.Count -ne 1) { throw 'Expected exactly one distribution wheel.' }
          python -m pip install --no-deps --target $target $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Validate external PyPI hydraulics distributions in the same isolated target.
          python -m pip install --no-deps --target $target "run-hy8>=2026.10.16.1" "ryan-culverts>=26.10.16.1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHONPATH = $target
          Push-Location $env:RUNNER_TEMP
          try {
            python "$env:GITHUB_WORKSPACE/repo-scripts/smoke_test_installed_wheel.py" --expected-root $target
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Upload verified distribution
        uses: actions/upload-artifact@v7
        with:
          name: pypi-distributions
          path: dist/ryan_functions-*.whl
          if-no-files-found: error

  publish:
    name: Publish verified wheel
    needs: [release, build]
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ryan-functions
    permissions:
      id-token: write

    steps:
      - name: Download verified distribution
        uses: actions/download-artifact@v8
        with:
          name: pypi-distributions
          path: dist/

      - name: Ensure PyPI has no equal or newer version before upload
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          PYPI_PROJECT: ryan-functions
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          proposed = os.environ["RELEASE_TAG"].removeprefix("v")
          def parts(value):
              if not re.fullmatch(r"(?:\d{2}|\d{4})\.\d+\.\d+\.\d+", value):
                  raise SystemExit(f"Cannot compare PyPI version {value!r}; release halted")
              return tuple(int(component) for component in value.split("."))

          url = "https://pypi.org/pypi/" + os.environ["PYPI_PROJECT"] + "/json"
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  registry = json.load(response)
              existing = registry["releases"]
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  existing = {}
              else:
                  raise
          target = parts(proposed)
          for version in existing:
              if parts(version) >= target:
                  raise SystemExit(f"Refusing {proposed}: PyPI already has {version}")
          print(f"Verified {proposed} is newer than all existing PyPI releases")
          PY

      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
