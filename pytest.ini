[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = . vendor/run_hy8/src
cache_dir = .pytest_cache
addopts = --strict-markers

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    gdal: marks tests requiring GDAL binaries or Python GDAL bindings
    gui: marks tests requiring a graphical display (tkinter, etc.)
