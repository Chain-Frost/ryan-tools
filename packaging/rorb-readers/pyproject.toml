[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ryan-rorb-readers"
version = "26.11.24.1"
description = "Dependency-light canonical RORB report readers maintained in ryan-tools"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-SUL-1.0"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
[project.urls]
Repository = "https://github.com/Chain-Frost/ryan-tools"

# The module source lives ONLY in ryan_library/functions/RORB.
# Install a wheel from this subproject in a complete ryan-tools checkout.
# Do not publish a source archive of this subdirectory in isolation.
[tool.setuptools]
include-package-data = false
# Package the existing root PEP 561 marker and its original __init__.
# The six canonical report modules below are still the only RORB modules.
packages = ["ryan_library"]
py-modules = [
  "ryan_library.functions.__init__",
  "ryan_library.functions.RORB.reader_types",
  "ryan_library.functions.RORB.readers",
  "ryan_library.functions.RORB.output_reader",
  "ryan_library.functions.RORB.result_readers",
  "ryan_library.functions.RORB.parameter_reader",
  "ryan_library.functions.RORB.associations",
]
[tool.setuptools.package-dir]
"ryan_library.functions.RORB" = "../../ryan_library/functions/RORB"
"ryan_library" = "../../ryan_library"
"ryan_library.functions" = "../../ryan_library/functions"

[tool.setuptools.package-data]
"ryan_library" = ["py.typed"]
